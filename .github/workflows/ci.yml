name: CI

on:
  push:
    branches: [ main, feat/*, fix/*, docs/* ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  test:
    name: Test & Security Verification
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --init
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm --needed git python python-coverage tmux libxkbcommon xkeyboard-config qt6-declarative qt6-base quickshell jq
      - name: Create non-root test user
        run: |
          useradd -m -u 1001 runner
          chmod 1777 /tmp
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup root-owned trusted commands and permissions
        run: |
          install -m 755 -o root -g root tests/mocks/hyprctl /usr/bin/hyprctl
          chown -R runner:runner "$GITHUB_WORKSPACE"
      - name: Validate Plugin Manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id == "luneth90.keycade"' manifest.json
          jq -e '.version != null' manifest.json
          jq -e '(.kinds | length) > 0' manifest.json
          jq -e '.entryPoints.overlay == "Keycade.qml"' manifest.json
          test -f Keycade.qml
      - name: Python Unit & Security Invariant Tests (with Coverage)
        run: |
          su runner -c "python3 -m coverage run --source=bin -m unittest discover -s tests -p 'test_*.py' -v"
          su runner -c "python3 -m coverage report"
          su runner -c "python3 -m coverage xml -o coverage.xml"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: QML Algorithm Tests
        run: |
          su runner -c "QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= QT_STYLE_OVERRIDE=Fusion /usr/lib/qt6/bin/qmltestrunner -input tests/qml/tst_algorithms.qml -import /usr/lib/qt6/qml"
      - name: QML Shell Integration Tests
        run: |
          su runner -c "./tests/test_state_store_qml.sh"
          su runner -c "./tests/test_hyprland_source_qml.sh"
          su runner -c "./tests/test_ground_switching_qml.sh"
          su runner -c "./tests/test_run_counters_qml.sh"
          su runner -c "./tests/test_mastery_transition_qml.sh"
      - name: Lint QML Components
        run: |
          su runner -c "/usr/lib/qt6/bin/qmllint -I /usr/lib/qt6/qml Keycade.qml lib/*.qml lib/sources/*.qml dev/InputProbe.qml"
